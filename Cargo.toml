[package]
name = "pine-mic"
version = "0.1.0"
edition = "2021"
description = "Turn an Android phone into a low-latency virtual microphone on Linux (PipeWire)"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }

# Audio: Opus decode, optional RNNoise, PulseAudio-protocol playback (served by pipewire-pulse)
audiopus = "0.2"
nnnoiseless = "0.5"
libpulse-binding = "2.28"
libpulse-simple-binding = "2.28"

# GUI + tray (used in turn 2: gui.rs / tray.rs)
eframe = "0.29"
ksni = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
