[package]
name = "pine-mic"
version = "0.1.0"
edition = "2021"
description = "Use an Android phone as a low-latency virtual microphone on Windows (Pine Mic port)"

[dependencies]
# error handling / CLI / Ctrl-C
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"

# GUI (glow = OpenGL backend, works everywhere on Windows without extra setup)
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }

# System tray (StatusNotifierItem replacement). Runs in its own thread with
# its own Win32 message loop, see src/tray.rs.
tray-icon = "0.19"

# Audio: Opus decoding (needs CMake + MSVC build tools to build libopus,
# see README.md), RNNoise (pure Rust) and WASAPI output via cpal.
audiopus = "0.2"
nnnoiseless = "0.5"
cpal = "0.15"

# Raw Win32 calls: hide/show the main window, attach to the parent console
# in --cli mode, post wake-up messages to the tray thread.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
